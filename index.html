<!DOCTYPE html>
<html lang="en">
<head>
    <title>Set Maker - Eleon Adventures</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="The official Eleon Adventures Set Maker. Build and export competitive-ready sets fast.">
    <meta name="keywords" content="Eleon Adventures Set Maker, Eleon Adventures sets, EA set maker, Loomian Legacy set maker">

    <script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.4.1.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.8/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.8/js/select2.min.js"></script>
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/3.1.2/rollups/md5.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/nodeca/pako@7abdb13e/dist/pako.min.js"></script>

    <link href="src/style.css" rel="stylesheet">
</head>
<body>
    <div class="page-scale">
        <h1 id="title">
            <span class="logo-mark" aria-hidden="true">
                <svg viewBox="0 0 64 64" role="img" focusable="false">
                    <defs>
                        <linearGradient id="logoGrad" x1="0" x2="1" y1="0" y2="1">
                            <stop offset="0%" stop-color="#6f8bff" />
                            <stop offset="100%" stop-color="#4c72ff" />
                        </linearGradient>
                    </defs>
                    <path d="M32 4l24 14v28L32 60 8 46V18z" fill="url(#logoGrad)" stroke="#2b3242" stroke-width="2" />
                    <path d="M32 16l13 7.5v15L32 46l-13-7.5v-15z" fill="rgba(15, 17, 22, 0.7)" stroke="#2b3242" stroke-width="1.5" />
                </svg>
            </span>
            <span class="logo-text">
                Eleon Adventures
                <span class="logo-sub">Set Maker</span>
            </span>
        </h1>

        <div class="wrap">
            <div class="panel table-panel">
                <div id="body" class="table-wrap" align="center"></div>
            </div>

            <div class="panel controls-panel">
                <div class="controls">
                    <button id="btn" onclick="saveSets()">Save Sets</button>
                    <textarea id="export" placeholder="Set data will appear here, copy and paste the set data into the LL damage calc"></textarea>
                    <a class="calc-link" href="https://elephages.github.io/EleonDamageClaculator/">Damage Calculator</a>
                </div>
            </div>
        </div>
    </div>

    <script src="src/app.js"></script>
    <script src="src/data.js"></script>
    <script>
        $(document).ready(function () {
            createTable();
            $(".pokeSelect").select2();
            $(".moveSelect").select2();
        })
    </script>
</body>
</html>
